name: Build tapdance-cli for Termux (Anti-Sanction)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      
      # ============================================
      # تنظیم DNS های مطمئن
      # ============================================
      - name: Setup reliable DNS
        run: |
          sudo bash -c 'echo "nameserver 1.1.1.1" > /etc/resolv.conf'
          sudo bash -c 'echo "nameserver 8.8.8.8" >> /etc/resolv.conf'
          sudo bash -c 'echo "nameserver 9.9.9.9" >> /etc/resolv.conf'
          sudo bash -c 'echo "nameserver 185.8.174.140" >> /etc/resolv.conf'
          sudo bash -c 'echo "nameserver 130.185.77.69" >> /etc/resolv.conf'
          echo "DNS configured:"
          cat /etc/resolv.conf
      
      # ============================================
      # نصب Go
      # ============================================
      - name: Setup Go
        run: |
          cd /tmp
          wget -q https://go.dev/dl/go1.24.1.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.24.1.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          export PATH=/usr/local/go/bin:$PATH
          go version
      
      # ============================================
      # تنظیم GOPROXY مقاوم
      # ============================================
      - name: Setup resilient GOPROXY
        run: |
          go env -w GOPROXY="https://goproxy.cn,https://goproxy.baidu.com,https://proxy.golang.org,https://goproxy.io,direct"
          go env -w GOSUMDB=off
          go env -w GO111MODULE=on
          echo "GOPROXY: $(go env GOPROXY)"
      
      # ============================================
      # دانلود وابستگی‌ها
      # ============================================
      - name: Download dependencies
        run: |
          go clean -modcache
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if go mod download; then
              echo "Download successful!"
              exit 0
            fi
            echo "Attempt $i failed, waiting 30 seconds..."
            sleep 30
          done
          echo "All attempts failed!"
          exit 1
      
      # ============================================
      # کامپایل برای ARM64
      # ============================================
      - name: Build for ARM64
        run: |
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=arm64
          go build -trimpath -ldflags="-s -w" -o tapdance-cli ./cli/main.go
          ls -lh tapdance-cli
      
      # ============================================
      # آپلود خروجی
      # ============================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapdance-cli-arm64
          path: tapdance-cli
          retention-days: 7
